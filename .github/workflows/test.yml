name: Test package and MCP
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[mcp]'
      - run: python -m unittest discover -s tests -v
      - run: python tests/smoke_mcp.py
      - run: python tests/smoke_names.py
      - run: python tools/check_skill_parity.py
      - run: jev-gate demo --out /tmp/bpj-demo.json
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: jev-decision-gate-python-${{ matrix.python }}
          path: dist/*.whl
